[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=gemini-3.8-flash --tools='' --safe-mode --setting-sources='user' --system-prompt='' --effort low --settings ~/.claude/settings-litellm.json"
template-append = """
- Use conventional commits format: feat:, fix:, docs:, style:, refactor:, test:, chore:, etc.
- Format: <type>(<optional scope>): <short description>
- Example: feat(auth): add OAuth2 login support
- Keep the subject line under 72 characters
"""

[post-commit]
play_sound = "afplay /System/Library/Sounds/Blow.aiff -t 1"

[list]
json-schema = 2
